const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const IN={keys:{},jx:0,jy:0,actQ:false,touch:false,

(function(){

 });
 $('#dlg').addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')onActKey()});
})();
let fsAutoT=0;
async function goFull(auto){
 AU.resume();const el=document.documentElement;
 if(!auto&&Date.now()-fsAutoT<1200)return; // il tocco che ha già attivato lo schermo intero automatico
 try{
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
   if(auto)fsAutoT=Date.now();
   if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
   try{await screen.orientation.lock('landscape')}catch(_){}
  }else{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}
 }catch(e){if(!auto)UI.toast('Schermo intero non disponibile qui')}
 setTimeout(fit,300);
}
// ================= AUDIO (tutto sintetizzato) =================
const MEL=[76,79,84,79,76,74,72,null, 76,72,69,72,76,77,76,null, 77,81,84,81,77,76,74,72, 74,79,83,79,77,74,71,null];
const BASS=[48,45,41,43];
const NIGHTM=[69,null,72,null,76,null,74,72,null,null,69,null,67,null,null,null,64,null,65,null,64,null,null,null,62,null,64,null,57,null,null,null];
const AU={c:null,vol:{m:.6,s:.8},mode:'none',step:0,next:0,
 init(){
  if(this.c)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

  this.sfx=c.createGain();this.sfx.connect(this.master);
  const N=c.sampleRate*2,b=c.createBuffer(1,N,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<N;i++)d[i]=Math.random()*2-1;this.nb=b;
  const L=c.sampleRate*3|0,ir=c.createBuffer(2,L,c.sampleRate);for(let ch=0;ch<2;ch++){const q=ir.getChannelData(ch);for(let i=0;i<L;i++)q[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}

  const ns=c.createBufferSource();ns.buffer=b;ns.loop=true;this.windF=c.createBiquadFilter();this.windF.type='bandpass';this.windF.frequency.value=500;this.windF.Q.value=.6;this.windG=c.createGain();this.windG.gain.value=0;ns.connect(this.windF);this.windF.connect(this.windG);this.windG.connect(this.master);ns.start();
  const rs=c.createBufferSource();rs.buffer=b;rs.loop=true;const rf=c.createBiquadFilter();rf.type='highpass';rf.frequency.value=1800;this.rainG=c.createGain();this.rainG.gain.value=0;rs.connect(rf);rf.connect(this.rainG);this.rainG.connect(this.master);rs.start(0,.7);
  this.next=c.currentTime+.1;this.applyVol();
 },
 applyVol(){if(!this.c)return;this.mus.gain.value=this.vol.m*.55;this.sfx.gain.value=this.vol.s},
 resume(){this.init();if(this.c&&this.c.state==='suspended')this.c.resume()},
 env(g,t,a,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec)},

 noise(t,dur,peak,ft,freq,q=1,dest,a=.005,fs){const c=this.c,s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(freq,t);if(fs)f.frequency.exponentialRampToValueAtTime(fs,t+dur);f.Q.value=q;const g=c.createGain();this.env(g,t,a,peak,dur);s.connect(f);f.connect(g);g.connect(dest||this.sfx);s.start(t,Math.random());s.stop(t+a+dur+.05);return g},

  const rain=G.st&&G.st.weather==='pioggia'&&G.mode==='game'?(G.map&&!G.map.interior?.09:.03):0;this.rainG.gain.setTargetAtTime(rain,now,.8);this.windF.frequency.setTargetAtTime(380+Math.sin(now*.27)*220+Hh*300,now,.6);

   const m=this.mode;const bpm=m==='tense'?152:m==='night'?70:m==='indoor'?80:(96-Hh*30);const sp=60/bpm/2;

  }

   if(G.night>.5&&Math.random()<.04)this.chirp(now);

 },

   let n=MEL[st];if(n!=null&&Hh>.3&&Math.random()<Hh*.35)n-=1;if(n!=null&&Hh>.6&&Math.random()<.25)n=null;

};

function flipH(c){const [d,x]=mk(c.width,c.height);x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return d}

function rampPick(ramp,v,X,Y){const n=ramp.length,f=clamp(v,0,.999)*n,i=Math.floor(f),fr=f-i;const th=((X+Y)&1)?.62:.38;return ramp[Math.min(n-1,fr>th?i+1:i)]}

function paintBlobs(x,blobs,ramp,o={}){const L=[-.55,-.83];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const [a,b,r] of blobs){x0=Math.min(x0,a-r);x1=Math.max(x1,a+r);y0=Math.min(y0,b-r);y1=Math.max(y1,b+r)}
 for(let Y=Math.floor(y0);Y<=Math.ceil(y1);Y++)for(let X=Math.floor(x0);X<=Math.ceil(x1);X++){
  let best=-1e9,bb=null;for(const bl of blobs){const e=bl[2]-Math.hypot(X+.5-bl[0],Y+.5-bl[1]);if(e>best){best=e;bb=bl}}
  if(best<0)continue;const nx=(X+.5-bb[0])/bb[2],ny=(Y+.5-bb[1])/bb[2];

  R_(x,rampPick(ramp,v,X,Y),X,Y)}}

const GSOLID=new Set([0,3,8,9,13]);
class GMap{
 constructor(id,w,h,o={}){this.id=id;this.w=w;this.h=h;this.interior=!!o.interior;this.name=o.name||id;this.g=new Uint8Array(w*h);this.sol=new Uint8Array(w*h);this.objs=[];this.hit={};this.lights=[];this.doors=[];this.smokes=[];}
 inb(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h}
 get(x,y){return this.inb(x,y)?this.g[y*this.w+x]:0}
 set(x,y,v){if(this.inb(x,y))this.g[y*this.w+x]=v}
 fill(x0,y0,x1,y1,v){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)this.set(x,y,v)}
 solid(x,y){if(!this.inb(x,y))return true;return this.sol[y*this.w+x]===1||GSOLID.has(this.g[y*this.w+x])}
 block(x,y){if(this.inb(x,y))this.sol[y*this.w+x]=1}
 add(o){this.objs.push(o);(o.solid||[]).forEach(([x,y])=>this.block(x,y));(o.hits||o.solid||[]).forEach(([x,y])=>{this.hit[x+','+y]=o});return o}
 objAt(x,y){return this.hit[x+','+y]}
}

function bfs(m,sx,sy,tx,ty,max=4000){
 if(sx===tx&&sy===ty)return [];const key=(x,y)=>y*m.w+x;const prev=new Int32Array(m.w*m.h).fill(-1);const q=[key(sx,sy)];prev[key(sx,sy)]=key(sx,sy);let n=0;
 while(q.length&&n++<max){const k=q.shift(),x=k%m.w,y=(k/m.w)|0;if(x===tx&&y===ty){const path=[];let c=k;while(c!==key(sx,sy)){path.push([c%m.w,(c/m.w)|0]);c=prev[c]}return path.reverse()}

function bubble(n,t,life=2.6){G.bubbles=G.bubbles.filter(b=>b.n!==n);G.bubbles.push({n,t:fmt(t),life})}
function npcGo(n,tx,ty){const m=G.maps[n.map];const [sx,sy]=ptile(n);const p=bfs(m,sx,sy,tx,ty);if(p)n.path=p;else{setPos(n,tx,ty);n.path=[]}}
const IMAP={chapel:'chapel',house:'house',barn:'barn'};
function npcExitTo(n){const [bx,by]=bdoor(IMAP[n.map]||'chapel');n.map='main';setPos(n,bx,by);n.path=[];n.goal=null}
function updateNPC(n,dt){
 n.barkT=(n.barkT||0)-dt;
 if(!n.script){
  const s=SCHED[n.id]?SCHED[n.id](G.st):null,idle=!(n.path&&n.path.length);
  if(!n.hidden&&n.map!=='main'){const im=G.maps[n.map],d=im&&im.doors[0];
   if(!d||G.map.id!==n.map)npcExitTo(n);else if(n.goal!=='exit'){n.goal='exit';npcGo(n,d.tx,d.ty)}else if(idle)npcExitTo(n)}
  else if(!s){
   if(!n.hidden){if(n.goal!=='home'){n.goal='home';const [hx,hy]=homeDoor(n.id);npcGo(n,hx,hy);n.fdir=null;n.speed=34}
    else if(idle){n.hidden=true;n.goal=null;if(G.map.id==='main'&&Math.hypot(n.x-G.player.x,n.y-G.player.y)<160)AU.play('door')}}
  }else{
   const [gx,gy]=freeNear(G.maps.main,s.x,s.y);
   if(n.hidden){if(s.snap)placeNPC(n,'main',gx,gy,s.d);else{const [hx,hy]=homeDoor(n.id);placeNPC(n,'main',hx,hy,0);if(G.map.id==='main'&&Math.hypot(n.x-G.player.x,n.y-G.player.y)<160)AU.play('door')}n.path=[];n.goal=null}
   const key=gx+','+gy;n.speed=s.run?52:s.act==='walk'?30:36;
   if(n.goal!==key){n.goal=key;n.home=[gx,gy];n.fdir=s.d;n.idleT=1+Math.random()*2;if(s.snap&&Math.hypot(n.x-gx*16-8,n.y-gy*16-14)>200){setPos(n,gx,gy);n.path=[]}else npcGo(n,gx,gy)}
   else if(!(n.path&&n.path.length))npcIdle(n,s,dt);
  }
 }
 if(n.path&&n.path.length){const [px,py]=n.path[0],gx=px*16+8,gy=py*16+14,dx=gx-n.x,dy=gy-n.y,d=Math.hypot(dx,dy),sp=n.speed*dt;
  if(d<=sp){n.x=gx;n.y=gy;n.path.shift();if(!n.path.length){if(n.fdir!=null)n.dir=n.fdir;if(n.res){const r=n.res;n.res=null;r()}}}
  else{n.x+=dx/d*sp;n.y+=dy/d*sp;n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0)}n.anim+=dt*(n.speed>45?10:7);n.moving=true}
 else n.moving=false;
}
function npcIdle(n,s,dt){n.idleT=(n.idleT||0)-dt;
 const dist=G.map.id==='main'?Math.hypot(n.x-G.player.x,n.y-G.player.y):1e9;
 if(s.act==='forge'){n.workT=(n.workT||0)-dt;n.dir=2;if(n.workT<=0){n.workT=.8;burst('spark',37*16+7,14*16-1,6,'#ffcf6a');if(dist<240&&AU.c){const v=clamp(1-dist/240,0,1)*.06,t=AU.c.currentTime;AU.osc('square',1400+Math.random()*300,t,.05,v);AU.osc('triangle',2100,t,.16,v*.7)}}return}
 if(s.act==='sweep'&&Math.random()<dt*2.5)G.parts.push({k:'puff',x:n.x+(n.dir===1?-7:n.dir===2?7:0),y:n.y-1,vx:(Math.random()-.5)*14,vy:-5,t:0,life:.8});
 if(s.act==='stall'){n.dir=0;if(n.idleT<=0){n.idleT=4+Math.random()*4;if(dist<110&&Math.random()<.35)bubble(n,['Semi freschi!','Zucche, rape, patate!','Prezzi onesti!'][Math.random()*3|0])}return}
 if(n.idleT>0)return;n.idleT=2+Math.random()*4;
 const [hx,hy]=n.home||ptile(n);
 if(s.wr>0&&Math.random()<.65){const m=G.maps.main;for(let k=0;k<6;k++){const tx=hx+Math.round((Math.random()*2-1)*s.wr),ty=hy+Math.round((Math.random()*2-1)*s.wr);if(!m.solid(tx,ty)){npcGo(n,tx,ty);n.fdir=null;return}}}
 n.dir=Math.random()<.5?(s.d??0):[0,1,2,3][Math.random()*4|0];
 if(s.act==='flowers'&&Math.random()<.3)bubble(n,'♪');
 if(s.act==='play'&&Math.random()<.2)bubble(n,'Hihi!',1.6);
}
function npcBarks(dt){if(G.cut||UI.busy()||G.map.id!=='main')return;const p=G.player;
 for(const n of G.npcs){if(n.hidden||n.script||n.map!=='main'||n.barkT>0)continue;const d=Math.hypot(n.x-p.x,n.y-p.y);if(d>52)continue;

function snapNPCs(){for(const n of G.npcs){if(n.script)continue;n.goal=null;const s=SCHED[n.id]?SCHED[n.id](G.st):null;

 await say('ezekiel','Prima di entrare nella Valle devi conoscere le Regole. Sono tre. Sono semplici.');
 await UI.paper(`<h2>Le Regole di Hollowmere</h2><div class="paper"><p><b>I.</b> Il rosso è il colore cattivo. Non raccoglierlo, non indossarlo. <b>Seppelliscilo.</b></p><p><b>II.</b> Non oltrepassare mai il recinto giallo.</p><p><b>III.</b> Quando suona la campana della sera, rientra in casa. <b>E non aprire a nessuno.</b></p></div>`,'Ho capito');
 const c=await ask('ezekiel','Rispettale, e Hollowmere sarà casa tua. Per sempre.',['Perché il rosso?','Cosa c\'è nel bosco?','Va bene.']);
 await say('ezekiel',['Perché è il colore cattivo. Non serve altro.','Niente. E quel niente non va disturbato.','{Bravo ragazzo|Brava ragazza}. Proprio come tuo nonno.'][c],c<2?'stern':'');
 await say('clara','Ti accompagniamo alla fattoria! È bellissima, vedrai. Un po\' polverosa. Il nonno non… insomma. Andiamo!');
 await UI.fade(1,1000);st.flags.arrived=1;ez.script=cl.script=false;G.cutMusic=null;
 st.day=1;st.time=6*60;morningSetup();rebuildMaps();snapNPCs();spawnCritters();G.parts=[];G.map=G.maps.house;setPos(G.player,2,3,0);NET.save(st);
 await UI.card('Capitolo I','Il Recinto Giallo','Giorno 1 · Autunno',false,true,1400);
 UI.showHud(true);UI.hotbar();UI.hud();UI.quest();updateCam(0);await UI.fade(0,900);G.cut--;
 await sleep(300);G.cut++;await narr('La casa del nonno. Odora di legno, lavanda e di qualcosa di chiuso da tanto tempo.');await narr('Fuori ti aspettano i campi. E il villaggio. Esci dalla porta in basso.\n(Muoviti con WASD o il pollice sinistro. E / Spazio / A per agire.)');G.cut--}
// ---------- giornata ----------
function morningSetup(){const st=G.st,F=st.flags;
 if(st.day>=2)F.bridgeGone=1;if(st.day>=2&&!F.gotPaint)F.ezWait=1;
 const ks=Object.keys(CHORES).filter(k=>k!==st.lastChore);st.chore=ks[Math.random()*ks.length|0];st.lastChore=st.chore;st.choreOk=false;st.choreDone=false;st.leaves=[0,0,0,0];F.bucket=0;F.barnDark=0;
 const wr=Math.random();st.weather=st.day<=1?'sereno':wr<.45?'sereno':wr<.65?'nuvoloso':wr<(st.chapter>=2?.85:.8)?'nebbia':'pioggia';
 if(st.weather==='pioggia')for(const k in st.farm)st.farm[k].w=true;
 if(st.chapter>=2&&F.ch2day&&st.day>=F.ch2day+1)F.page2avail=1;
 st.map='house';st.px=2;st.py=3;st.dir=0}
async function morningEvents(){const st=G.st,F=st.flags;G.cut++;
 try{
  if(F.missedOffer&&!F.missedShown){F.missedShown=1;AU.play('scratch');await sleep(600);await narr('Stanotte qualcosa ha grattato la porta per ore.');await narr('Sul legno, all\'esterno, lettere incise a unghiate:\nAVEVI DIMENTICATO.',{dark:1});addQuiete(-15)}
  if(st.chapter>=2&&!F.ch2card){F.ch2card=1;F.ch2day=st.day;await UI.fade(1,300);await UI.card('Capitolo II','Quelli di cui non si parla',`Giorno ${st.day}`,false,true,1400);await UI.fade(0,600);await narr('Ti svegli. La casa è silenziosa. Qualcosa è cambiato, ma non sai dire cosa.')}
  if(st.weather==='pioggia')UI.toast('Piove. I campi si annaffiano da soli.');else if(st.weather==='nebbia')UI.toast('Nebbia fitta sulla Valle.');
  if(F.page2avail&&!F.page2&&!F.page2seen){F.page2seen=1;await narr('Sul pavimento, vicino alla porta, c\'è un foglio. Qualcuno l\'ha fatto scivolare sotto l\'uscio, stanotte.')}
 }finally{G.cut--}UI.quest()}
async function endDay(passed,faded){const st=G.st;G.cut++;
 try{if(!faded){AU.play('sleep');await UI.fade(1,900)}
  G.horse.on=false;G.chase=false;G.cutMusic=null;G.scare=0;
  for(const k in st.farm){const f=st.farm[k];if(f.c&&f.w)f.c.a++;f.w=false;if(!f.c&&Math.random()<.08)delete st.farm[k]}
  const pay=st.shipped.reduce((a,[id,n])=>a+ITEMS[id].v*n,0);st.money+=pay;st.shipped=[];
  st.day++;st.time=6*60;st.energy=passed?60:100;if(!passed)addQuiete(st.chapter>=2?6:10);st.talked={};st.gifted={};
  morningSetup();rebuildMaps();snapNPCs();spawnCritters();st.flags.pettedToday=0;G.parts=[];G.map=G.maps.house;setPos(G.player,2,3,0);
  NET.save(st);UI.hud();UI.quest();UI.hotbar();
  await UI.card('',`Giorno ${st.day}`,`${DAYN[(st.day+3)%7]} · Autunno${pay?` · Spedizione: +${pay}g`:''}`,false,false,1300);
  updateCam(0);await UI.fade(0,800);
 }finally{G.cut--}
 await morningEvents()}
async function rest(min,outside){const st=G.st;const target=Math.min(st.time+min,20*60+30);if(target<=st.time)return;G.cut++;
 try{await UI.fade(1,500);const h=(target-st.time)/60;while(st.time<target){st.time++;onMinute()}st.energy=Math.min(100,st.energy+Math.round(h*(outside?6:12)));snapNPCs();G.parts=[];UI.hud();UI.quest();await sleep(250);await UI.fade(0,600);
  UI.toast(`${outside?'Hai aspettato':'Hai riposato'}. Sono le ${Math.floor(st.time/60)}:${String(st.time%60).padStart(2,'0')}.`)}finally{G.cut--}}
async function passOut(){const st=G.st;if(G.cut)return;G.cut++;await narr('Sono le due di notte. Crolli dal sonno dove ti trovi.');G.cut--;await endDay(true)}
async function caught(){const F=G.st.flags;G.cut++;G.chase=false;AU.play('scream');G.scare=1.6;G.shake=8;await sleep(1400);
 if(F.finaleChase&&!F.ch2end){G.cut--;return gameOver()}
 await UI.fade(1,600);G.scare=0;await UI.card('','…','Ti risvegli nel tuo letto. Non ricordi come ci sei arrivat{o|a}.<br>Hai le unghie piene di terra.',true,true,1200);
 G.st.money=Math.floor(G.st.money*.8);addQuiete(-25);G.cut--;await endDay(true,true)}
async function gameOver(){G.cut++;await UI.fade(1,500);G.scare=0;await UI.card('Fine','Hollowmere ti ha contat{o|a}.','Il Cavaliere non perdona chi corre piano.<br>Riprova dalla porta del fienile.',true,true,1500);
 G.st=JSON.parse(G.checkpoint);G.st.flags.finaleChase=1;G.st.flags.barnEvent=1;G.st.flags.barnDark=1;rebuildMaps();snapNPCs();G.map=G.maps.main;setPos(G.player,58,31,0);updateCam(0);UI.hud();UI.quest();UI.hotbar();
 await UI.fade(0,500);spawnHorse(44,40,60);G.cut--}
async function goMap(id,tx,ty,dir=0,quick){G.cut++;
 try{AU.play('door');await UI.fade(1,quick?150:260);if(id!=='main'){G.horse.on=false;if(!G.st.flags.finaleChase||G.st.flags.ch2end)G.chase=false}
  G.map=G.maps[id];G.st.map=id;G.parts=[];setPos(G.player,tx,ty,dir);updateCam(0);await UI.fade(0,quick?150:260);
 }finally{G.cut--}
 await onEnter(id)}
async function onEnter(id){const st=G.st,F=st.flags;
 if(id==='house'&&F.finaleChase&&!F.ch2end)return finale();
 if(id==='house'&&F.vespro&&!F.ch1end)return ch1End();
 if(id==='main'&&F.ezWait&&st.time<20*60&&Math.hypot(G.player.x-168,G.player.y-174)<40){G.cut++;try{const ez=NPC('ezekiel');await sleep(400);ez.dir=3;await ezekielPaint(ez)}finally{G.cut--}}
 if(id==='chapel'&&st.day>=3&&st.chapter<=1&&!F.vespro&&st.time>=18*60&&st.time<=19*60+30)return vespro();
 if(id==='barn'&&!F.barnIn){F.barnIn=1;G.cut++;await narr('Dentro puzza di cera, di fieno… e di stalla.');await narr('Ma a Hollowmere non ci sono cavalli.');G.cut--}
}
// ---------- Vespro ----------
async function vespro(){const st=G.st,F=st.flags;G.cut++;F.vespro=1;G.cutMusic='silent';
 const seats={ezekiel:[2,4,3],agatha:[3,4,3],brom:[10,4,3],clara:[11,4,3],tobia:[10,6,3],lucius:[7,3,0]};
 for(const k in seats){const n=NPC(k);n.script=true;placeNPC(n,'chapel',...seats[k])}
 await walkPlayer(6,7);G.player.dir=3;
 await say('lucius','Benvenut{o|a} al Vespro, {n}. Siediti dove vuoi. Qui c\'è sempre posto.');
 await say('lucius','Come ogni sera di raccolto, ci contiamo. Così sappiamo di esserci tutti.');
 const order=['ezekiel','agatha','brom','clara','tobia'];
 for(let i=0;i<order.length;i++){const n=NPC(order[i]);AU.play('count');floatText(String(i+1),n.x,n.y-30,'#fff4c0',2.2);await sleep(700)}
 AU.play('count');floatText('6',G.player.x,G.player.y-30,'#fff4c0',2.2);await say('lucius','E tu fai sei.');
 const lu=NPC('lucius');AU.play('count');floatText('7',lu.x,lu.y-30,'#fff4c0',2);await say('lucius','E io, sette.');
 await sleep(900);const fl=NPC('faceless');fl.script=true;placeNPC(fl,'chapel',11,8,3);
 AU.play('wrongcount');floatText('8',fl.x,fl.y-30,'#ff6a5a',3);G.glitch=10;await sleep(1300);
 NPC('tobia').dir=0;AU.play('laugh');await say('tobia','Hihi. Otto.','dark');
 await say('lucius','…Otto.','dark');
 G.player.dir=2;await sleep(500);await narr('Ti giri verso il fondo della cappella.');await narr('Sull\'ultima panca siede qualcuno. Non ha la faccia. Non ha niente, dove dovrebbe esserci una faccia.',{dark:1});
 AU.play('sting');G.flash={a:1,c:'#000'};fl.hidden=true;fl.script=true;fl.map='none';await sleep(900);
 await say('ezekiel','Lucius ha sbagliato i conti. Succede, quando si invecchia.','stern');
 await say('lucius','Otto. Come ogni anno, a questo punto.','dark');
 await say('ezekiel','Andate a casa. Tutti. La campana suonerà presto.','stern');
 addQuiete(-20);for(const k in seats)NPC(k).script=false;setPos(G.player,7,8,0);G.cutMusic=null;G.cut--;UI.quest()}
// ---------- fine Capitolo I ----------
async function ch1End(){const st=G.st,F=st.flags;G.cut++;G.cutMusic='silent';
 await sleep(900);AU.play('hooves');await narr('Fuori, zoccoli. Girano attorno alla casa.');
 await sleep(500);AU.play('hooves');await narr('Una volta. Due volte. Tre.');
 await sleep(400);AU.play('knock');G.shake=3;await sleep(1200);
 const c=await ask('voce','{n}… sono io. Il nonno. Fa tanto freddo, qui fuori. Aprimi.',['Apri la porta','Non aprire']);
 if(c===0){await sleep(300);AU.play('scream');G.scare=1.5;G.shake=7;await sleep(1700);await narr('Non c\'è nessuno.');await narr('Sulla soglia, quattro impronte di zoccoli bruciate nel legno. Ancora fumano.',{dark:1});addQuiete(-25)}
 else{await sleep(800);AU.play('laugh');await narr('Silenzio. Poi una risata bassa, che non è quella del nonno.');await narr('Il nonno non ha mai bussato così.');addQuiete(-10)}
 AU.play('page');await narr('Da sotto la porta scivola un pezzo di carta. Una sola riga:\n«Uno di troppo.»',{dark:1});
 await UI.fade(1,800);await UI.card('Fine del Capitolo I','Il Recinto Giallo','Hai rispettato le regole.<br>Le regole non rispetteranno te.',false,true,1800);
 F.ch1end=1;st.chapter=2;G.cutMusic=null;G.cut--;await endDay(false,true)}
// ---------- finale Capitolo II ----------
async function finale(){const st=G.st,F=st.flags;G.cut++;G.chase=false;G.horse.on=false;G.cutMusic='silent';F.ch2end=1;
 AU.play('slam');G.shake=5;await narr('Sbatti la porta e ci appoggi la schiena. Il cuore ti batte in gola.');
 await sleep(800);AU.play('hooves');await sleep(1800);await narr('Gli zoccoli si fermano. Proprio davanti alla porta.');
 await sleep(1200);AU.play('knock');await sleep(1000);
 await say('voce','Hai letto il mio nome, vero, {n}? Elias Marlowe. Risparmiato.');
 await say('voce','Non avere paura. Non è colpa tua. Non è nemmeno colpa mia.');
 G.glitch=10;AU.play('whisper');await say('voce','Alla Festa del Raccolto saremo di nuovo insieme. Uno del mio sangue.',null,{dark:1});
 AU.play('sting');G.scare=.9;await sleep(1200);
 await UI.fade(1,900);await UI.card('Fine del Capitolo II','Quelli di cui non si parla','Il costume era vuoto.<br>Il Cavaliere no.',true,true,2000);
 await UI.card('Prossimamente','Capitolo III — L\'Albero dei Morti','Il Varco si aprirà. La Festa si avvicina.<br>Intanto la vita a Hollowmere continua… finché dura.',false,true,1600);
 G.cutMusic=null;G.cut--;await endDay(false,true)}
// ---------- tempo ----------
function clock(dt){if(G.cut||UI.busy())return;G.clockAcc+=dt;while(G.clockAcc>=SEC_PER_MIN){G.clockAcc-=SEC_PER_MIN;G.st.time++;onMinute()}}
function onMinute(){const st=G.st,t=st.time,F=st.flags;if(st.day<1)return;
 if(t%10===0)UI.hud();
 if(t===12*60&&!(st.chore==='campana'&&st.choreOk)){AU.play('bell');if(G.map.id==='main')UI.toast('🔔 Mezzogiorno. Fratello Lucius suona la campana.')}
 if(t===21*60){AU.play('bell');AU.play('bell',1.7);AU.play('bell',3.4);UI.toast('🔔 La campana della sera. Rientra a casa.','bad')}
 if(t===18*60&&F.gotBread&&!F.offered)UI.toast('Il sole cala. È l\'ora del ceppo.');
 if(t===20*60+31&&F.gotBread&&!F.offered&&!F.missedOffer){F.missedOffer=1;UI.quest()}
 const out=G.map.id==='main';
 if(out&&t>21*60+30&&t%10===0&&!F.finaleChase)addQuiete(-1);
 if(out&&t===22*60&&!G.horse.on&&!F.finaleChase){AU.play('hooves');UI.toast('Zoccoli. Lontani. Poi meno lontani.','bad')}
 if(out&&t>=22*60+30&&!G.horse.on&&!G.cut&&!F.finaleChase){const p=G.player;const far=Math.hypot(p.x-31*16,p.y-5*16)>120;spawnHorse(far?31:52,far?5:36,54);UI.toast('CORRI A CASA.','bad')}
 if(t>=26*60)passOut();
}
function chooseMusic(){if(G.mode==='title')return 'title';if(G.cutMusic)return G.cutMusic;if(G.chase)return 'tense';const m=G.map;if(!m)return 'none';if(m.id==='barn')return 'silent';if(m.interior)return 'indoor';const t=G.st.time;if(t>=20*60||t<6*60||G.horror>.7)return 'night';return 'day'}
function updHorror(dt){const st=G.st;if(!st)return;let h=(100-st.quiete)/100*.75;if(st.chapter>=2)h+=.12;if(G.map&&G.map.id==='main')h+=G.night*.1;if(G.chase)h+=.2;if(G.mode==='title')h=.05;G.horror=lerp(G.horror,clamp(h,0,1),Math.min(1,dt*.8))}
// ---------- loop ----------
let _last=performance.now(),_hudT=0;
function update(dt){
 const frozen=UI.modalOpen;
 if(!frozen){updatePlayer(dt);if(!UI.dlgOpen){for(const n of G.npcs)updateNPC(n,dt);npcBarks(dt);updChats(dt)}updCritters(dt);
  if(G.st.weather==='pioggia'&&!G.map.interior&&!G.cut&&Math.random()<dt*.01){G.flash={a:.5,c:'#dfe8ff'};AU.play('thunder',.5)}if(!G.cut&&!UI.dlgOpen)updateHorse(dt);clock(dt)}
 updParts(dt);if(G.map)updateCam(dt);updHorror(dt);
 G.flash.a=Math.max(0,G.flash.a-dt*1.5);G.scare=Math.max(0,G.scare-dt*.7);
 _hudT-=dt;if(_hudT<=0){_hudT=.5;UI.hud();UI.quest()}
}
function updateTitle(dt){if(G.critters)updCritters(dt);const t=G.t;G.cam.x=300+Math.sin(t*.05)*260;G.cam.y=150+Math.sin(t*.031)*90;G.st.time=19*60+10;updParts(dt)}
function loop(now){const dt=Math.min(.05,(now-_last)/1000);_last=now;G.t+=dt;
 try{if(G.mode==='game'&&G.map)update(dt);else if(G.mode==='title')updateTitle(dt);render()}catch(e){console.error(e)}
 try{AU.setMode(chooseMusic());AU.tick()}catch(e){}
 requestAnimationFrame(loop)}
async function boot(){
 try{await Promise.race([document.fonts.ready,sleep(2500)])}catch(e){}
 genAll();initEntities();UI.init();NET.init();
 toTitle();$('#loading').classList.add('hide');requestAnimationFrame(loop);
}
boot();
</script>
