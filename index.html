<script>
'use strict';
// ================= CORE =================
let W=480;const H=270,TS=16,MAXW=640;
const cv=document.getElementById('game');const ctx=cv.getContext('2d');cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function rnd(){_seed^=_seed<<13;_seed>>>=0;_seed^=_seed>>>17;_seed^=_seed<<5;_seed>>>=0;return _seed/4294967296}

function fit(){
 const vw=innerWidth,vh=innerHeight;
 // larghezza logica adattiva: riempie schermi larghi (es. telefoni 20:9) invece di lasciare bande nere

 if(nw!==W){W=nw;cv.width=W;ctx.imageSmoothingEnabled=false}

addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);
// su telefono: qualsiasi tocco nel menu iniziale attiva lo schermo intero (serve un gesto dell'utente)
const fsTap=()=>{if(!matchMedia('(pointer:coarse)').matches)return;if(document.fullscreenElement||document.webkitFullscreenElement)return;const t=document.getElementById('title');if(t&&!t.classList.contains('hide'))goFull(true)};
addEventListener('touchend',fsTap,{passive:true});addEventListener('click',fsTap);addEventListener('orientationchange',()=>setTimeout(fit,250));fit();
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const DIRV=[[0,1],[-1,0],[1,0],[0,-1]]; // down,left,right,up

// global game object
const G={st:null,maps:{},map:null,player:null,npcs:[],horse:null,mode:'boot',cut:0,paused:false,t:0,cam:{x:0,y:0},parts:[],floats:[],shake:0,flash:{a:0,c:'#fff'},horror:0,night:0,clockAcc:0,scare:0,bubbles:[]};

// ================= INPUT =================
const IN={keys:{},jx:0,jy:0,actQ:false,touch:false,
 mx(){let x=0;if(this.keys.ArrowLeft||this.keys.KeyA)x--;if(this.keys.ArrowRight||this.keys.KeyD)x++;return x||this.jx},
 my(){let y=0;if(this.keys.ArrowUp||this.keys.KeyW)y--;if(this.keys.ArrowDown||this.keys.KeyS)y++;return y||this.jy},

function onActKey(){AU.resume();if(UI.dlgOpen){UI.advance();return}if(UI.modalOpen||G.cut||G.mode!=='game')return;IN.actQ=true}
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT'){if(e.code==='Enter'&&UI.onEnter)UI.onEnter();return}
 IN.keys[e.code]=true;AU.resume();
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 if(e.repeat)return;
 if(e.code==='Space'||e.code==='KeyE'||e.code==='Enter')onActKey();
 if(e.code==='Escape'||e.code==='KeyP'||e.code==='Tab'){e.preventDefault();UI.pauseKey()}
 if(/^Digit[0-9]$/.test(e.code)){let n=+e.code[5];n=n===0?9:n-1;UI.selectSlot(n)}
 if(e.code==='KeyF')goFull();
});
addEventListener('keyup',e=>{IN.keys[e.code]=false});
addEventListener('blur',()=>{IN.keys={}});
addEventListener('wheel',e=>{if(G.mode==='game'&&G.st&&!UI.modalOpen){UI.selectSlot((G.st.sel+(e.deltaY>0?1:9))%10)}},{passive:true});
addEventListener('touchstart',()=>{if(!IN.touch){IN.touch=true;document.body.classList.add('touch')}},{passive:true});
if(matchMedia('(pointer:coarse)').matches){IN.touch=true;document.body.classList.add('touch')}
(function(){
 const jz=$('#joyzone'),joy=$('#joy'),knob=$('#knob');let jid=null,ox=0,oy=0;
 jz.addEventListener('pointerdown',e=>{if(UI.dlgOpen){onActKey();return}jid=e.pointerId;try{jz.setPointerCapture(jid)}catch(_){}const r=jz.getBoundingClientRect();ox=e.clientX;oy=e.clientY;joy.style.left=(e.clientX-r.left)+'px';joy.style.top=(e.clientY-r.top)+'px';joy.classList.add('on');AU.resume()});
 jz.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;const s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||2;const R=s*20;let dx=e.clientX-ox,dy=e.clientY-oy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}knob.style.transform=`translate(${dx}px,${dy}px)`;IN.jx=Math.abs(dx)>R*.25?dx/R:0;IN.jy=Math.abs(dy)>R*.25?dy/R:0});
 const end=e=>{if(e.pointerId!==jid)return;jid=null;IN.jx=IN.jy=0;knob.style.transform='';joy.classList.remove('on')};
 jz.addEventListener('pointerup',end);jz.addEventListener('pointercancel',end);
 $('#bA').addEventListener('pointerdown',e=>{e.preventDefault();onActKey()});
 cv.addEventListener('pointerdown',e=>{
  AU.resume();
  if(UI.dlgOpen){onActKey();return}
  if(e.pointerType!=='mouse'||G.mode!=='game'||G.cut||UI.modalOpen)return;
  const r=cv.getBoundingClientRect();const wx=(e.clientX-r.left)/r.width*W+G.cam.x,wy=(e.clientY-r.top)/r.height*H+G.cam.y;
  const p=G.player;const dx=wx-p.x,dy=wy-(p.y-8);
  if(Math.abs(dx)>Math.abs(dy))p.dir=dx<0?1:2;else p.dir=dy<0?3:0;
  IN.actQ=true;
 });
 $('#dlg').addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')onActKey()});

 get(x,y){return this.inb(x,y)?this.g[y*this.w+x]:0}
 set(x,y,v){if(this.inb(x,y))this.g[y*this.w+x]=v}
 fill(x0,y0,x1,y1,v){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)this.set(x,y,v)}
 solid(x,y){if(!this.inb(x,y))return true;return this.sol[y*this.w+x]===1||GSOLID.has(this.g[y*this.w+x])}
 block(x,y){if(this.inb(x,y))this.sol[y*this.w+x]=1}
 add(o){this.objs.push(o);(o.solid||[]).forEach(([x,y])=>this.block(x,y));(o.hits||o.solid||[]).forEach(([x,y])=>{this.hit[x+','+y]=o});return o}
 objAt(x,y){return this.hit[x+','+y]}

function buildGround(m){const gw=m.w*16,gh=m.h*16;const [c,x]=mk(gw,gh);m.ground=c;m.water=false;m.shore=[];

 const isG=(tx,ty)=>{const g=m.get(tx,ty);return g===1||g===12};
 for(let ty=0;ty<m.h;ty++)for(let tx=0;tx<m.w;tx++){const g=m.get(tx,ty);if(g!==2&&g!==11)continue;const X0=tx*16,Y0=ty*16;

    else if(dx===1){px=X0+16-len;py=Y0+i;w=len;h=1;sx=px-1;sy=py}else{px=X0;py=Y0+i;w=len;h=1;sx=px+len;sy=py}

 if(m.water)for(let ty=0;ty<m.h;ty++)for(let tx=0;tx<m.w;tx++){if(m.get(tx,ty)!==3)continue;const X0=tx*16,Y0=ty*16,n=m.get(tx,ty-1),s=m.get(tx,ty+1);
  if(n!==3&&n!==4){m.shore.push([tx,ty]);for(let i=0;i<16;i++){const k=2+hsh(tx*16+i,7)%2;x.fillStyle='#3a2716';x.fillRect(X0+i,Y0,1,k+1);x.fillStyle='#5a3e24';x.fillRect(X0+i,Y0,1,k-1)}}

  const s=SHADOWK[o.kind];if(!s)continue;x.beginPath();x.ellipse(o.dx+o.img.width/2+s[2],o.sy-1,s[0],s[1],0,0,Math.PI*2);x.fill()}

function freeNear(m,x,y){if(!m.solid(x,y))return [x,y];for(let r=1;r<6;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;if(!m.solid(x+dx,y+dy))return [x+dx,y+dy]}return [x,y]}
// BFS per NPC/cavaliere
function bfs(m,sx,sy,tx,ty,max=4000){
 if(sx===tx&&sy===ty)return [];const key=(x,y)=>y*m.w+x;const prev=new Int32Array(m.w*m.h).fill(-1);const q=[key(sx,sy)];prev[key(sx,sy)]=key(sx,sy);let n=0;
 while(q.length&&n++<max){const k=q.shift(),x=k%m.w,y=(k/m.w)|0;if(x===tx&&y===ty){const path=[];let c=k;while(c!==key(sx,sy)){path.push([c%m.w,(c/m.w)|0]);c=prev[c]}return path.reverse()}
  for(const [dx,dy] of DIRV){const nx=x+dx,ny=y+dy;if(!m.inb(nx,ny))continue;const nk=key(nx,ny);if(prev[nk]!==-1)continue;if(m.solid(nx,ny)&&!(nx===tx&&ny===ty))continue;prev[nk]=k;q.push(nk)}}
 return null}

function updatePlayer(dt){

 if(p.auto){const [tx,ty]=p.auto;const gx=tx*16+8,gy=ty*16+14,dx=gx-p.x,dy=gy-p.y,d=Math.hypot(dx,dy);if(d<2){p.x=gx;p.y=gy;p.auto=null;if(p.autoRes){const r=p.autoRes;p.autoRes=null;r()}}else{mx=dx/d;my=dy/d}
  p.moving=!!p.auto;if(p.moving){p.dir=Math.abs(mx)>Math.abs(my)?(mx<0?1:2):(my<0?3:0);p.x+=mx*44*dt;p.y+=my*44*dt;p.anim+=dt*7}return}

function npcGo(n,tx,ty){const m=G.maps[n.map];const [sx,sy]=ptile(n);const p=bfs(m,sx,sy,tx,ty);if(p)n.path=p;else{setPos(n,tx,ty);n.path=[]}}
const IMAP={chapel:'chapel',house:'house',barn:'barn'};
function npcExitTo(n){const [bx,by]=bdoor(IMAP[n.map]||'chapel');n.map='main';setPos(n,bx,by);n.path=[];n.goal=null}
function updateNPC(n,dt){
 n.barkT=(n.barkT||0)-dt;
 if(!n.script){
  const s=SCHED[n.id]?SCHED[n.id](G.st):null,idle=!(n.path&&n.path.length);
  if(!n.hidden&&n.map!=='main'){const im=G.maps[n.map],d=im&&im.doors[0];
   if(!d||G.map.id!==n.map)npcExitTo(n);else if(n.goal!=='exit'){n.goal='exit';npcGo(n,d.tx,d.ty)}else if(idle)npcExitTo(n)}
  else if(!s){
   if(!n.hidden){if(n.goal!=='home'){n.goal='home';const [hx,hy]=homeDoor(n.id);npcGo(n,hx,hy);n.fdir=null;n.speed=34}
    else if(idle){n.hidden=true;n.goal=null;if(G.map.id==='main'&&Math.hypot(n.x-G.player.x,n.y-G.player.y)<160)AU.play('door')}}
  }else{
   const [gx,gy]=freeNear(G.maps.main,s.x,s.y);
   if(n.hidden){if(s.snap)placeNPC(n,'main',gx,gy,s.d);else{const [hx,hy]=homeDoor(n.id);placeNPC(n,'main',hx,hy,0);if(G.map.id==='main'&&Math.hypot(n.x-G.player.x,n.y-G.player.y)<160)AU.play('door')}n.path=[];n.goal=null}
   const key=gx+','+gy;n.speed=s.run?52:s.act==='walk'?30:36;
   if(n.goal!==key){n.goal=key;n.home=[gx,gy];n.fdir=s.d;n.idleT=1+Math.random()*2;if(s.snap&&Math.hypot(n.x-gx*16-8,n.y-gy*16-14)>200){setPos(n,gx,gy);n.path=[]}else npcGo(n,gx,gy)}
   else if(!(n.path&&n.path.length))npcIdle(n,s,dt);
  }
 }
 if(n.path&&n.path.length){const [px,py]=n.path[0],gx=px*16+8,gy=py*16+14,dx=gx-n.x,dy=gy-n.y,d=Math.hypot(dx,dy),sp=n.speed*dt;
  if(d<=sp){n.x=gx;n.y=gy;n.path.shift();if(!n.path.length){if(n.fdir!=null)n.dir=n.fdir;if(n.res){const r=n.res;n.res=null;r()}}}
  else{n.x+=dx/d*sp;n.y+=dy/d*sp;n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0)}n.anim+=dt*(n.speed>45?10:7);n.moving=true}
 else n.moving=false;
}

 const dist=G.map.id==='main'?Math.hypot(n.x-G.player.x,n.y-G.player.y):1e9;

 AU.play('slam');G.shake=5;await narr('Sbatti la porta e ci appoggi la schiena. Il cuore ti batte in gola.');
 await sleep(800);AU.play('hooves');await sleep(1800);await narr('Gli zoccoli si fermano. Proprio davanti alla porta.');
 await sleep(1200);AU.play('knock');await sleep(1000);
 await say('voce','Hai letto il mio nome, vero, {n}? Elias Marlowe. Risparmiato.');
 await say('voce','Non avere paura. Non è colpa tua. Non è nemmeno colpa mia.');
 G.glitch=10;AU.play('whisper');await say('voce','Alla Festa del Raccolto saremo di nuovo insieme. Uno del mio sangue.',null,{dark:1});
 AU.play('sting');G.scare=.9;await sleep(1200);
 await UI.fade(1,900);await UI.card('Fine del Capitolo II','Quelli di cui non si parla','Il costume era vuoto.<br>Il Cavaliere no.',true,true,2000);
 await UI.card('Prossimamente','Capitolo III — L\'Albero dei Morti','Il Varco si aprirà. La Festa si avvicina.<br>Intanto la vita a Hollowmere continua… finché dura.',false,true,1600);
 G.cutMusic=null;G.cut--;await endDay(false,true)}
// ---------- tempo ----------
function clock(dt){if(G.cut||UI.busy())return;G.clockAcc+=dt;while(G.clockAcc>=SEC_PER_MIN){G.clockAcc-=SEC_PER_MIN;G.st.time++;onMinute()}}
function onMinute(){const st=G.st,t=st.time,F=st.flags;if(st.day<1)return;
 if(t%10===0)UI.hud();
 if(t===21*60){AU.play('bell');AU.play('bell',1.7);AU.play('bell',3.4);UI.toast('🔔 La campana della sera. Rientra a casa.','bad')}
 if(t===18*60&&F.gotBread&&!F.offered)UI.toast('Il sole cala. È l\'ora del ceppo.');
 if(t===20*60+31&&F.gotBread&&!F.offered&&!F.missedOffer){F.missedOffer=1;UI.quest()}
 const out=G.map.id==='main';
 if(out&&t>21*60+30&&t%10===0&&!F.finaleChase)addQuiete(-1);
 if(out&&t===22*60&&!G.horse.on&&!F.finaleChase){AU.play('hooves');UI.toast('Zoccoli. Lontani. Poi meno lontani.','bad')}
 if(out&&t>=22*60+30&&!G.horse.on&&!G.cut&&!F.finaleChase){const p=G.player;const far=Math.hypot(p.x-31*16,p.y-5*16)>120;spawnHorse(far?31:52,far?5:36,54);UI.toast('CORRI A CASA.','bad')}
 if(t>=26*60)passOut();
}
function chooseMusic(){if(G.mode==='title')return 'title';if(G.cutMusic)return G.cutMusic;if(G.chase)return 'tense';const m=G.map;if(!m)return 'none';if(m.id==='barn')return 'silent';if(m.interior)return 'indoor';const t=G.st.time;if(t>=20*60||t<6*60||G.horror>.7)return 'night';return 'day'}
function updHorror(dt){const st=G.st;if(!st)return;let h=(100-st.quiete)/100*.75;if(st.chapter>=2)h+=.12;if(G.map&&G.map.id==='main')h+=G.night*.1;if(G.chase)h+=.2;if(G.mode==='title')h=.05;G.horror=lerp(G.horror,clamp(h,0,1),Math.min(1,dt*.8))}
// ---------- loop ----------
let _last=performance.now(),_hudT=0;
function update(dt){
 const frozen=UI.modalOpen;
 if(!frozen){updatePlayer(dt);if(!UI.dlgOpen){for(const n of G.npcs)updateNPC(n,dt);npcBarks(dt)}
  if(G.st.weather==='pioggia'&&!G.map.interior&&!G.cut&&Math.random()<dt*.01){G.flash={a:.5,c:'#dfe8ff'};AU.play('thunder',.5)}if(!G.cut&&!UI.dlgOpen)updateHorse(dt);clock(dt)}
 updParts(dt);if(G.map)updateCam(dt);updHorror(dt);
 G.flash.a=Math.max(0,G.flash.a-dt*1.5);G.scare=Math.max(0,G.scare-dt*.7);
 _hudT-=dt;if(_hudT<=0){_hudT=.5;UI.hud();UI.quest()}
}
function updateTitle(dt){const t=G.t;G.cam.x=300+Math.sin(t*.05)*260;G.cam.y=150+Math.sin(t*.031)*90;G.st.time=19*60+10;updParts(dt)}
function loop(now){const dt=Math.min(.05,(now-_last)/1000);_last=now;G.t+=dt;
 try{if(G.mode==='game'&&G.map)update(dt);else if(G.mode==='title')updateTitle(dt);render()}catch(e){console.error(e)}
 try{AU.setMode(chooseMusic());AU.tick()}catch(e){}
 requestAnimationFrame(loop)}
async function boot(){
 try{await Promise.race([document.fonts.ready,sleep(2500)])}catch(e){}
 genAll();initEntities();UI.init();NET.init();
 toTitle();$('#loading').classList.add('hide');requestAnimationFrame(loop);
}
boot();
</script>
