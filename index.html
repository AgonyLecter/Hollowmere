<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Hollowmere — La Valle Quieta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&text=0123456789&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="stage">
 <canvas id="game"></canvas>
 <div id="hud" class="hide">
  <div id="quest" class="dark"><b>Obiettivo</b><span id="qtext"></span></div>
  <div id="topbtns"><button id="bPause" class="btn ib" title="Menu (Esc)">☰</button><button id="bFull" class="btn ib" title="Schermo intero">⛶</button></div>
  <div id="clock" class="dark"><div id="cday"><span id="cdayt"></span><canvas id="cwx" width="20" height="20"></canvas></div><div id="ctime"></div><div id="cbar"><div id="cmark"></div></div><div id="cmoney"></div></div>
  <div id="energy" class="dark"><div id="efill"></div></div>
  <div id="hotbar" class="dark"></div>
  <div id="itemname"></div>
 </div>
 <div id="touch"><div id="joyzone"><div id="joy"><div id="knob"></div></div></div><button id="bA">A</button></div>
 <div id="dlg" class="panel hide"><canvas id="portrait" width="64" height="64"></canvas><div id="dname"></div><div id="dtext"></div><div id="dchoices"></div><div id="dnext">▼</div></div>
 <div id="toasts"></div>
 <div id="title" class="hide">
  <div id="tlogo">Hollowmere</div><div id="tsub">La Valle Quieta</div>
  <div id="tmenu">
   <button data-a="new">Nuova partita</button>
   <button data-a="cont">Continua</button>
   <button data-a="code">Carica da codice</button>
   <button data-a="opts">Opzioni</button>
   <button data-a="full">Schermo intero</button>
  </div>
  <div id="tfoot"><span id="tnet">Connessione alla Valle…</span> · <span id="tcount"></span></div>
 </div>
 <div id="modal" class="hide"><div id="mbox" class="panel"></div></div>
 <div id="card" class="hide"><div id="cardk"></div><div id="cardt"></div><div id="cards"></div></div>
 <div id="fade"></div>
 <div id="fx"></div>
 <div id="loading">Hollowmere<small>la valle si sveglia…</small></div>
</div>
<div id="rotate"><div class="ph"></div>Ruota il telefono in orizzontale<br><small style="opacity:.6">La Valle ti aspetta.</small></div>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/farm.js"></script>
<script src="js/npc.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/life.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body></html>
